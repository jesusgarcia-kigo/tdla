<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin:0; height:100%; background:#000; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>
  <script>
    // ?mute=1 para navegadores (bloquean autoplay con sonido). En el webview de la app no hace falta.
    var mute = new URLSearchParams(location.search).get('mute') === '1' ? 1 : 0;
    var src = 'https://www.youtube.com/embed/j7BWdr3H-KU?autoplay=1&playsinline=1&rel=0&loop=1&playlist=j7BWdr3H-KU&mute=' + mute;
    document.write('<iframe src="' + src + '" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>');
  </script>
</body>
</html>
